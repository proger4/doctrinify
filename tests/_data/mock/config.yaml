models_path: 'tests/_output/sandbox/models'

base_classes:
  - 'app\\models\\BaseModel'

doctrine_xml_path: 'tests/_output/generated/doctrine'

schema_path: 'tests/_data/oracle/schema.sql'

database:
  dsn: 'oci:dbname=mock_legacy'
  username: 'root'
  password: ''

blacklist:
  - 'app\\models\\Old*'
  - 'app\\models\\Test*'

flags:
  best_effort: true
  generate_doctrine_xml: true
  generate_php_accessors: true
  dump_schemas: true

primary_key_strategy: 'database'

naming:
  getter_prefix: 'get'
  setter_prefix: 'set'
  add_prefix: 'add'
  remove_prefix: 'remove'
  ucfirst: true

tooling:
  doctrine_xml:
    root_attributes:
      xmlns: "http://doctrine-project.org/schemas/orm/doctrine-mapping"
    filename_pattern: "{class}.orm.xml"
  regeneration:
    add_generated_marker: true
    embed_diagnostics: false
